[package]
name = "diskpeek-scanner"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "scanner"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ignore = "0.4"    # WalkBuilder with true parallel readdir support
crossbeam-channel = "0.5"

[target.'cfg(windows)'.dependencies]
mft = "0.6"
